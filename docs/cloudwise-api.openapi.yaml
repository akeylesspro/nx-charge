                      Duration: "01:00:00"

  /getUserCdrs:
    post:
      tags: [CDRs]
      operationId: getUserCdrs
      summary: All CDRs of the account
      description: |
        Returns every CDR (final billing record) of the Akeyless account.

        ### Preconditions
        - A valid `FirebaseToken`.
        - `assetId` of the account. No session id is needed — the call returns the whole account history.
        - For a CDR to be used, its session must already be stopped in nx-charge (status other than `started`) and not
          yet linked to a CDR.

        ### Practical usage
        **When:** every 5 minutes (only on the instance with `run_tasks=true`), with the fixed values shown in the
        example.

        **Why:** safety net for final billing. A session normally receives its CDR from `getCommandStatus` 20 s after
        the stop; when Cloudwise did not have it yet, this job finds it later. The CDR is the source of truth for what
        the car pays.

        **Current state:** the job never finds a match today, because nx-charge's CDR parser does not copy `SessionId`
        (see *Known issues*). The table below is the designed behavior.

        **What nx-charge does with the result:**
        | result | handling |
        |---|---|
        | a CDR whose `SessionId` matches a stopped session without `cdr_id` | the car is charged `TotalCost` (minus what was charged at stop if the session is already `paid`); the CDR is stored in `nx-charge-cdrs/{Id}` with `paid` and the session gets `cdr_id` |
        | that CDR is already stored with `paid: true` | skipped |
        | no CDR for a stopped session yet | nothing; checked again on the next run (no time limit) |
        | sessions still `started` | ignored |
        | `ErrorCode > 0` (e.g. `401`) or network error / timeout | job run fails and is logged; next run in 5 min (timeouts are the most common failure, since the whole history is fetched) |

        ### Response fields used
        `Items[]` → `Id`, `SessionId`, `OcpPartyId`, `StartDateTime`, `EndDateTime`, `LastUpdated`, `Currency`,
        `TotalCost`, `TotalCostWithVat`, `TotalFixCost`, `TotalFixCostWithVat`, `TotalEnergy`, `TotalTime`,
        `TotalParkingTime`, `AvgKwhPrice`, `Duration`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetUserCdrsRequest"
            example:
              FirebaseToken: eyJhbGciOiJSUzI1NiIs...
              skip: 0
              pageSize: 99999999
              assetId: ASSET_ID_FROM_CONFIG
              timeZone: 0
      responses:
        "200":
          description: Success when `ErrorCode` is 0; failure when `ErrorCode > 0`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserCdrsResponse"

components:
  examples:
    CdrItem:
      value: *cdr_example

  schemas:
    # ---------------- auth ----------------
    SignInRequest:
      type: object
      required: [email, password, returnSecureToken]
      properties:
        email:
          type: string
          format: email
          description: Cloudwise account email (`nx-settings/cloudwise.email`).
        password:
          type: string
          format: password
          description: Cloudwise account password (`nx-settings/cloudwise.password`).
        returnSecureToken:
          type: boolean
          enum: [true]
    SignInResponse:
      type: object
      description: Standard Firebase Auth response. nx-charge uses only `idToken`.
      required: [idToken]
      properties:
        idToken:
          type: string
          description: Firebase ID token — sent as `FirebaseToken` in every Cloudwise request.
        refreshToken:
          type: string
        expiresIn:
          type: string
          example: "3600"
        localId:
          type: string
        email:
          type: string

    # ---------------- shared ----------------
    AuthenticatedRequest:
      type: object
      required: [FirebaseToken]
      properties:
        FirebaseToken:
          type: string
          description: Firebase `idToken` from `signInWithPassword`.
    CloudwiseResponse:
      type: object
      description: Envelope returned by every Cloudwise endpoint.
      required: [ErrorCode]
      properties:
        ErrorCode:
          $ref: "#/components/schemas/CloudwiseErrorCode"
        StatusCode:
          type: integer
          description: Present on error responses; `200` in every error seen in production.
        ErrorMessage:
          type: string
          nullable: true
        ErrorProvider:
          type: integer
        Count:
          type: integer
        RequestID:
          type: string
        ServerTime:
          type: string
          format: date-time

    # ---------------- requests ----------------
    GetLocationsRequest:
      allOf:
        - $ref: "#/components/schemas/AuthenticatedRequest"
        - type: object
          required: [lat, lon, radius, Skip, PageSize, TimeZone]
          properties:
            lat:
              type: number
              description: Center latitude. nx-charge sends 0.
            lon:
              type: number
              description: Center longitude. nx-charge sends 0.
            radius:
              type: integer
              description: Radius in meters. nx-charge sends 10000.
            Skip:
              type: integer
              description: Paging offset. nx-charge sends 0.
            PageSize:
              type: integer
              description: Page size. nx-charge sends 99999999 (everything in one page).
            TimeZone:
              type: integer
              description: Time-zone offset. nx-charge sends 0.
    GetLocationDetailsRequest:
      allOf:
        - $ref: "#/components/schemas/AuthenticatedRequest"
        - type: object
          required: [LocationId, PartyID, CountryCode]
          properties:
            LocationId:
              type: string
              description: Raw Cloudwise location `Id` (not the composite nx-charge id).
            PartyID:
              type: string
              description: Location party id (`PartyId` from `getLocations`).
            CountryCode:
              type: string
              description: Always `IL`.
              example: IL
    SendCommandRequest:
      allOf:
        - $ref: "#/components/schemas/AuthenticatedRequest"
        - type: object
          required: [command, LocationId, CountryCode, evseUid, connectorId, ignoreDistanceCheck, BleId, DeviceId, AssetId, Latitude, Longitude]
          properties:
            command:
              $ref: "#/components/schemas/SessionCommand"
            LocationId:
              type: string
              description: Location id. See the table in the operation description for the exact value per case.
            PartyID:
              type: string
              description: Location party id. Sent only on automatic START_SESSION; omitted on app start and on STOP_SESSION.
            CountryCode:
              type: string
              description: Always `IL`.
            commandId:
              type: string
              description: Session id (= `CommandId` returned by START_SESSION). Required for STOP_SESSION; omitted for START_SESSION.
            evseUid:
              type: string
              description: EVSE `Uid`.
            connectorId:
              type: string
              description: Connector `Id` within the EVSE.
            ignoreDistanceCheck:
              type: boolean
              description: Always `false`.
            BleId:
              type: string
              description: Account BLE id (`nx-settings/cloudwise.ble_id`).
            DeviceId:
              type: string
              description: Account device id (`nx-settings/cloudwise.device_id`).
            AssetId:
              type: string
              description: Account asset id (`nx-settings/cloudwise.asset_id`).
            Latitude:
              type: number
              description: Always `0`.
            Longitude:
              type: number
              description: Always `0`.
    GetCommandStatusRequest:
      allOf:
        - $ref: "#/components/schemas/AuthenticatedRequest"
        - type: object
          required: [assetId, BleId, commandId, deviceId]
          properties:
            assetId:
              type: string
              description: Account asset id.
            BleId:
              type: string
              description: Account BLE id.
            commandId:
              type: string
              description: Session id (= `CommandId` returned by START_SESSION).
            deviceId:
              type: string
              description: Account device id.
    GetUserCdrsRequest:
      allOf:
        - $ref: "#/components/schemas/AuthenticatedRequest"
        - type: object
          required: [skip, pageSize, assetId, timeZone]
          properties:
            skip:
              type: integer
              description: Paging offset. nx-charge sends 0.
            pageSize:
              type: integer
              description: Page size. nx-charge sends 99999999.
            assetId:
              type: string
              description: Account asset id.
            timeZone:
              type: integer
              description: Time-zone offset. nx-charge sends 0.

    # ---------------- responses ----------------
    GetLocationsResponse:
      allOf:
        - $ref: "#/components/schemas/CloudwiseResponse"
        - type: object
          properties:
            Items:
              type: array
              items:
                $ref: "#/components/schemas/OcpiLocation"
    GetLocationDetailsResponse:
      allOf:
        - $ref: "#/components/schemas/CloudwiseResponse"
        - type: object
          required: [Location]
          properties:
            Location:
              type: object
              description: Wrapper (note the nested `Location.Location`).
              required: [Location, Evses]
              properties:
                Location:
                  $ref: "#/components/schemas/Location"
                Evses:
                  type: array
                  items:
                    $ref: "#/components/schemas/Evse"
                ErrorMessage:
                  type: string
                  nullable: true
                ErrorCode:
                  type: integer
    SendCommandResponse:
      allOf:
        - $ref: "#/components/schemas/CloudwiseResponse"
        - type: object
          properties:
            CommandId:
              type: string
              description: Session id. Required in a successful START_SESSION response.
    GetCommandStatusResponse:
      allOf:
        - $ref: "#/components/schemas/CloudwiseResponse"
        - type: object
          required: [CommandStatus]
          properties:
            CommandStatus:
              $ref: "#/components/schemas/CommandStatus"
            Status:
              type: string
              description: Textual status (not used by nx-charge).
            ChargingTimeInSeconds:
              type: string
              description: Charging time in seconds, as a numeric string.
              example: "754"
            CommandId:
              type: string
              description: Session id.
            SessionId:
              type: string
            Kwh:
              type: string
              description: Energy delivered so far, as a numeric string.
              example: "4.215"
            Cost:
              type: string
              description: Cost so far (ILS), as a numeric string. Compared live against the car's credit balance.
              example: "10.90"
            Cdr:
              $ref: "#/components/schemas/CdrItem"
    GetUserCdrsResponse:
      allOf:
        - $ref: "#/components/schemas/CloudwiseResponse"
        - type: object
          properties:
            Items:
              type: array
              items:
                $ref: "#/components/schemas/CdrItem"

    # ---------------- enums ----------------
    CloudwiseErrorCode:
      type: integer
      description: |
        `0` = success, anything above `0` = failure. Cloudwise does not publish a full list; these are the codes it
        returned to nx-charge in production (2026-09-21 → 2026-10-21):
        | code | `ErrorMessage` | returned by | meaning / handling |
        |---|---|---|---|
        | `0` | — | all | success |
        | `401` | `Authentication error` | `getLocations`, `getUserCdrs` | `FirebaseToken` expired or invalid — log in again |
        | `1000` | `The charger is not available` | `sendCommand` START_SESSION | the charger cannot accept a start right now |
        | `1003` | `timeout in connecting the plug` | `sendCommand` START_SESSION | the charger did not detect a connected plug in time |
        | `1015` | `OCPI_ERROR_CPO_DECLINED` | `sendCommand` START_SESSION | the charge point operator refused the remote start (most common start error) |
      example: 0
    SessionCommand:
      type: string
      description: |
        | value | meaning |
        |---|---|
        | `START_SESSION` | authorize the EVSE to start charging; returns `CommandId` (session id) |
        | `STOP_SESSION` | end the session identified by `commandId` |
      enum: [START_SESSION, STOP_SESSION]
    CommandStatus:
      type: string
      description: |
        State of a session, returned by `getCommandStatus`. nx-charge checks with `includes`.
        | value | meaning | nx-charge handling |
        |---|---|---|
        | `ACTIVE` | session running at the charger | keep monitoring every 30 s |
        | `COMPLETED` | session ended normally | stop flow; after the stop, final numbers and CDR are saved |
        | `FAILED` | session failed at the charger / operator | stop flow; no final numbers saved |
      enum: [ACTIVE, COMPLETED, FAILED]
    EvseStatus:
      type: string
      description: |
        Status of an EVSE (charging point). Values follow OCPI 2.2.1, plus `PREPARING`, which Cloudwise passes through
        from the charger.
        | value | meaning | start candidate | shown in the app |
        |---|---|---|---|
        | `AVAILABLE` | free, no car connected | no | yes |
        | `PREPARING` | a car is connected and the charger is preparing / waiting for authorization | **yes** | yes |
        | `BLOCKED` | occupied and not charging — in practice: cable connected, waiting for authorization | **yes** | yes |
        | `CHARGING` | a session is delivering energy | no | yes |
        | `RESERVED` | reserved for another driver | no | no |
        | `INOPERATIVE` | temporarily out of service | no | no |
        | `OUTOFORDER` | broken | no | no |
        | `PLANNED` | not yet in operation | no | no |
        | `REMOVED` | decommissioned | no | no |
        | `UNKNOWN` | status not reported by the operator | no | no |
      enum: [AVAILABLE, PREPARING, BLOCKED, CHARGING, RESERVED, INOPERATIVE, OUTOFORDER, PLANNED, REMOVED, UNKNOWN]
    ConnectorFormat:
      type: string
      description: |
        | value | meaning |
        |---|---|
        | `CABLE` | a cable is attached to the charger (shown as "cable included") |
        | `SOCKET` | the driver brings a cable |
      enum: [CABLE, SOCKET]
    ConnectorStandard:
      type: string
      description: |
        Plug type (OCPI 2.2.1 `ConnectorType`). The relevant ones in Israel:
        | value | plug | nx-charge handling |
        |---|---|---|
        | `IEC_62196_T2` | Type 2 (AC) | shown in the app; can be started |
        | `IEC_62196_T2_COMBO` | CCS2 (DC) | shown in the app; can be started |
        | `CHADEMO` | CHAdeMO (DC) | hidden; on plug-in another connector of the same EVSE is preferred |
        | `IEC_62196_T1` / `IEC_62196_T1_COMBO` | Type 1 / CCS1 | hidden |
        | `GBT_AC` / `GBT_DC` | Chinese GB/T | hidden |
        | `DOMESTIC_*`, `IEC_60309_*`, `NEMA_*` | household / industrial sockets | hidden |
        | others | rare / regional | hidden |
      enum:
        - CHADEMO
        - CHAOJI
        - DOMESTIC_A
        - DOMESTIC_B
        - DOMESTIC_C
        - DOMESTIC_D
        - DOMESTIC_E
        - DOMESTIC_F
        - DOMESTIC_G
        - DOMESTIC_H
        - DOMESTIC_I
        - DOMESTIC_J
        - DOMESTIC_K
        - DOMESTIC_L
        - DOMESTIC_M
        - DOMESTIC_N
        - DOMESTIC_O
        - GBT_AC
        - GBT_DC
        - IEC_60309_2_single_16
        - IEC_60309_2_three_16
        - IEC_60309_2_three_32
        - IEC_60309_2_three_64
        - IEC_62196_T1
        - IEC_62196_T1_COMBO
        - IEC_62196_T2
        - IEC_62196_T2_COMBO
        - IEC_62196_T3A
        - IEC_62196_T3C
        - NEMA_5_20
        - NEMA_6_30
        - NEMA_6_50
        - NEMA_10_30
        - NEMA_10_50
        - NEMA_14_30
        - NEMA_14_50
        - PANTOGRAPH_BOTTOM_UP
        - PANTOGRAPH_TOP_DOWN
        - TESLA_R
        - TESLA_S
    PowerType:
      type: string
      description: |
        Electrical supply of a connector (OCPI 2.2.1).
        | value | meaning |
        |---|---|
        | `AC_1_PHASE` | AC, single phase |
        | `AC_2_PHASE` | AC, two phases |
        | `AC_2_PHASE_SPLIT` | AC, split phase |
        | `AC_3_PHASE` | AC, three phases (typical Type 2 in Israel) |
        | `DC` | direct current (fast charging) |
      enum: [AC_1_PHASE, AC_2_PHASE, AC_2_PHASE_SPLIT, AC_3_PHASE, DC]
    DayOfWeek:
      type: string
      description: Day a tariff item applies to (OCPI 2.2.1).
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
    AuthMethod:
      type: string
      nullable: true
      description: |
        How the CDR's session was authorized (OCPI 2.2.1).
        | value | meaning |
        |---|---|
        | `AUTH_REQUEST` | authorized by a real-time request to the eMSP |
        | `COMMAND` | started by a remote command (`sendCommand`) |
        | `WHITELIST` | authorized locally from a whitelist |
      enum: [AUTH_REQUEST, COMMAND, WHITELIST, null]
    TokenType:
      type: string
      nullable: true
      description: |
        Type of the token on the CDR (OCPI 2.2.1).
        | value | meaning |
        |---|---|
        | `AD_HOC_USER` | one-time user (e.g. paid at the charger) |
        | `APP_USER` | user of a mobile app |
        | `RFID` | RFID card |
        | `OTHER` | anything else |
      enum: [AD_HOC_USER, APP_USER, RFID, OTHER, null]

    # ---------------- location model ----------------
    Location:
      type: object
      properties:
        Id:
          type: string
          description: Cloudwise location id (unique only together with party + country).
        OwnerCountryCode:
          type: string
