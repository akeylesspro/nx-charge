          nullable: true
        Latitude:
          type: number
        Longitude:
          type: number
        PhysicalReference:
          type: string
          nullable: true
          description: Label printed on the charger.
        Directions:
          type: string
          nullable: true
        ParkingRestrictions:
          type: string
          nullable: true
        Images:
          type: string
          nullable: true
        LastUpdated:
          type: string
          format: date-time
          description: Last status change. Used to match a plugged-in car to the EVSE whose status changed closest to the plug-in time.
    Evse:
      description: EVSE as returned by `getLocationDetails` (with tariffs).
      allOf:
        - $ref: "#/components/schemas/EvseBase"
        - type: object
          properties:
            Capabilities:
              type: string
            Description:
              type: array
              items:
                type: string
            Connectors:
              type: array
              items:
                $ref: "#/components/schemas/Connector"
    OcpiEvse:
      description: EVSE as returned by `getLocations` (no tariffs).
      allOf:
        - $ref: "#/components/schemas/EvseBase"
        - type: object
          properties:
            OcpiConnectors:
              type: array
              items:
                $ref: "#/components/schemas/OcpiConnector"
    OcpiConnector:
      type: object
      description: Connector as returned by `getLocations`.
      properties:
        Id:
          type: string
          description: Connector id within the EVSE — sent as `connectorId` in `sendCommand`.
        EvseUid:
          type: string
        Standard:
          $ref: "#/components/schemas/ConnectorStandard"
        Format:
          $ref: "#/components/schemas/ConnectorFormat"
        PowerType:
          $ref: "#/components/schemas/PowerType"
        MaxVoltage:
          type: number
        MaxAmperage:
          type: number
        MaxElectricPower:
          type: number
        TermsAndConditions:
          type: string
          nullable: true
        TariffId:
          type: string
        LastUpdated:
          type: string
          format: date-time
    Connector:
      description: Connector as returned by `getLocationDetails` (adds pricing).
      allOf:
        - $ref: "#/components/schemas/OcpiConnector"
        - type: object
          properties:
            PricePerKwh:
              type: number
            ConnectionFee:
              type: number
            ParkingFee:
              type: number
            TariffDetails:
              $ref: "#/components/schemas/TariffDetails"
    TariffDetails:
      type: object
      properties:
        PricePerKwh:
          type: number
        ConnectionFee:
          type: number
        ParkingFee:
          type: number
          nullable: true
        Currency:
          type: string
          example: ILS
        TariffItems:
          type: array
          items:
            $ref: "#/components/schemas/TariffItem"
        ErrorMessage:
          type: string
          nullable: true
        ErrorCode:
          type: integer
    TariffItem:
      type: object
      properties:
        Text:
          type: string
          nullable: true
        Currency:
          type: string
        Prices:
          type: array
          items:
            type: object
            properties:
              Type:
                type: integer
                description: Numeric price-component code. Cloudwise does not document the mapping; nx-charge stores it as is.
              Price:
                type: number
              Vat:
                type: number
        From:
          type: string
          format: date-time
        To:
          type: string
          format: date-time
        DaysOfWeek:
          type: array
          items:
            $ref: "#/components/schemas/DayOfWeek"

    # ---------------- CDR ----------------
    CdrItem:
      type: object
      description: Charge Detail Record — the final, billable record of a session.
      properties:
        OcpCountryCode:
          type: string
        OcpPartyId:
          type: string
          description: Charging operator party id.
        Id:
          type: string
          description: CDR id.
        StartDateTime:
          type: string
          format: date-time
        EndDateTime:
          type: string
          format: date-time
        SessionId:
          type: string
          description: Equals the `CommandId` returned by START_SESSION. The join key between sessions and CDRs.
        AuthMethod:
          $ref: "#/components/schemas/AuthMethod"
        AuthorizationReference:
          type: string
          nullable: true
        Currency:
          type: string
          example: ILS
        TotalCost:
          type: number
          description: Amount billed to the car.
        TotalCostWithVat:
          type: number
        TotalCostExcVat:
          type: number
          nullable: true
        TotalFixCost:
          type: number
        TotalFixCostWithVat:
          type: number
        TotalEnergy:
          type: number
          description: kWh.
        TotalEnergyCost:
          type: number
        TotalEnergyCostWithVat:
          type: number
        TotalTime:
          type: number
        TotalTimeCost:
          type: number
          nullable: true
        TotalTimeCostWithVat:
          type: number
          nullable: true
        TotalParkingTime:
          type: number
          nullable: true
        TotalParkingCost:
          type: number
          nullable: true
        TotalParkingCostWithVat:
          type: number
          nullable: true
        TotalReservationCost:
          type: number
          nullable: true
        TotalReservationCostWithVat:
          type: number
          nullable: true
        CdrTokenCountryCode:
          type: string
        CdrTokenPartyId:
          type: string
        CdrTokenUid:
          type: string
          nullable: true
        CdrTokenType:
          $ref: "#/components/schemas/TokenType"
        CdrTokenContractId:
          type: string
          nullable: true
        InvoiceReferenceId:
          type: string
          nullable: true
        CreditsBalance:
          type: number
          nullable: true
        CreditsExpirationDate:
          type: string
          nullable: true
        Credit:
          type: boolean
        CreditReferenceId:
          type: string
          nullable: true
        HomeCharging:
          type: boolean
        LastUpdated:
          type: string
          format: date-time
        AvgKwhPrice:
          type: number
        Duration:
          type: string
          description: "Format `HH:mm:ss`."
          example: "01:00:00"
